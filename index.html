<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>WatchMe – Family Points Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{background:linear-gradient(160deg,#0f0c29,#302b63 55%,#0f0c29);min-height:100vh;font-family:'Nunito',sans-serif;color:#fff;display:flex;justify-content:center}
  #app{width:100%;max-width:430px;min-height:100vh;position:relative}
  input,button{font-family:'Nunito',sans-serif;outline:none}
  input[type=file]{display:none}
  .btn{cursor:pointer;border:none;transition:transform .12s}
  .btn:active{transform:scale(.95)}
  .card{cursor:pointer;transition:transform .15s}
  .card:active{transform:scale(.97)}
  @keyframes pop{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .fadein{animation:fadein .3s ease}
  .float{animation:float 3s ease-in-out infinite}
  .spin{animation:spin 1s linear infinite;display:inline-block}

  /* PIN screen */
  #pin-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px}
  .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;width:100%;max-width:290px}
  .numpad button{height:60px;border-radius:14px;font-size:22px;font-weight:800;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#fff;cursor:pointer;transition:transform .1s}
  .numpad button:active{transform:scale(.93)}
  .numpad button.empty{background:transparent;border:none;cursor:default}
  .numpad button.backspace{font-size:18px}
  .pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:26px}
  .pin-dot{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.2);transition:all .2s}
  .pin-dot.filled{background:#7C3AED;border-color:#7C3AED}

  /* Modals */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px}
  .modal{background:#1a1030;border-radius:22px;padding:26px;max-width:290px;width:100%;text-align:center}

  /* Toast */
  #toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9999;padding:11px 22px;border-radius:999px;font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:pop .25s ease;display:none}

  /* Header */
  .header{padding:22px 18px 0}
  .sync-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.28);border-radius:999px;padding:3px 11px;font-size:10px;font-weight:800;color:#6EE7B7;margin-bottom:14px}
  .sync-dot{width:5px;height:5px;border-radius:50%;background:#10B981;display:inline-block}
  .kid-tabs{display:flex;gap:9px;overflow-x:auto;padding-bottom:8px}
  .kid-tab{flex-shrink:0;border-radius:16px;padding:9px 13px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:all .2s;border:2px solid transparent}

  /* Content */
  #content{padding:18px 18px 110px}

  /* Avatar */
  .ava{border-radius:50%;object-fit:cover;flex-shrink:0;display:block}
  .ava-emoji{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}

  /* Hero */
  .hero{border-radius:26px;padding:22px;text-align:center;margin-bottom:18px}
  .hero-photo-wrap{position:relative;display:inline-block;margin-bottom:10px}
  .hero-edit-btn{position:absolute;bottom:2px;right:2px;width:27px;height:27px;border-radius:50%;background:rgba(15,10,35,.9);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}

  /* Category grid */
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .cat-card{background:rgba(255,255,255,0.06);border-radius:14px;padding:13px;border:1px solid rgba(255,255,255,0.1)}

  /* Action buttons */
  .action-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
  .action-grid-2b{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}

  /* Bottom nav */
  #bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(8,4,18,.96);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.08);padding:11px 18px 24px;display:flex;justify-content:space-around}
  .nav-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:10px;cursor:pointer;transition:color .15s;font-family:'Nunito',sans-serif}
  .nav-icon{font-size:20px}

  /* Award view */
  .amount-pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
  .amount-pill{border:none;border-radius:9px;padding:7px 14px;color:#fff;font-weight:800;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;transition:transform .1s}
  .amount-pill:active{transform:scale(.95)}
  .cat-pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .cat-pick{border-radius:13px;padding:11px 6px;text-align:center;cursor:pointer;transition:all .15s}

  /* Reward grid */
  .reward-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .reward-card{border-radius:18px;padding:16px;text-align:center;transition:transform .15s;cursor:pointer}
  .reward-card:active{transform:scale(.97)}

  /* History */
  .hist-list{display:flex;flex-direction:column;gap:9px}
  .hist-item{background:rgba(255,255,255,0.06);border-radius:14px;padding:13px;border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:11px}
  .hist-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .parent-badge{background:rgba(255,255,255,0.1);border-radius:999px;padding:1px 7px;font-weight:700;font-size:10px}

  /* Color swatches */
  .color-swatch{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;transition:outline .1s}

  /* Form fields */
  .field-label{font-size:11px;font-weight:800;opacity:.5;letter-spacing:2px;text-transform:uppercase;margin-bottom:9px}
  .text-input{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:11px;padding:11px 14px;color:#fff;font-size:15px;font-weight:700;font-family:'Nunito',sans-serif}
  .text-input::placeholder{color:rgba(255,255,255,.3)}
  .section-label{font-size:11px;font-weight:800;opacity:.45;letter-spacing:2px;text-transform:uppercase;margin-bottom:11px}

  /* Scrollbar */
  ::-webkit-scrollbar{width:3px;height:3px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <!-- Hidden file inputs -->
  <input type="file" id="img-input" accept="image/*"/>
  <input type="file" id="edit-img-input" accept="image/*"/>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- Screens injected by JS -->
</div>

<script>
// ─── Config ────────────────────────────────────────────────────────────────────
const FB_KEY = "AIzaSyBdCG9Ov-O6YUUHTxBRavTWtmYVctUW7kc";
const FB_URL  = "https://watchme-f9df7-default-rtdb.firebaseio.com";

const CATS = [
  {id:"behavior",  label:"Behavior",          emoji:"⭐"},
  {id:"kindness",  label:"Kindness",           emoji:"💛"},
  {id:"bedtime",   label:"Bedtime",            emoji:"🌙"},
  {id:"music",     label:"Music Practice",     emoji:"🎵"},
  {id:"malayalam", label:"Malayalam Practice", emoji:"🗣️"},
  {id:"reading",   label:"Reading",            emoji:"📖"},
];
const REWARDS = [
  {id:"movie",     label:"Movie Night",   emoji:"🎬", cost:50},
  {id:"toy",       label:"New Toy",       emoji:"🧸", cost:200},
  {id:"outing",    label:"Fun Outing",    emoji:"🎡", cost:150},
  {id:"treat",     label:"Special Treat", emoji:"🍦", cost:30},
  {id:"game",      label:"Game Night",    emoji:"🎮", cost:75},
  {id:"sleepover", label:"Sleepover",     emoji:"🌙", cost:120},
];
const KIDS0 = [
  {id:"1", name:"Cristin", avatar:"🦄", color:"#FF6B9D", photo:null},
  {id:"2", name:"Janet",   avatar:"🦊", color:"#FF9500", photo:null},
];
const AVA_OPTS = ["🐶","🐱","🦊","🐻","🐼","🦁","🐸","🐯","🦋","🦄","🐙","🐳"];
const CLR_OPTS = ["#FF6B9D","#FF9500","#7C3AED","#10B981","#3B82F6","#F59E0B","#EF4444","#06B6D4"];

// ─── State ──────────────────────────────────────────────────────────────────────
let state = {
  screen: "pin",      // pin | app
  pin: "",
  currentPin: null,
  data: null,         // {kids, pts, hist, ts}
  activeKid: "1",
  view: "home",       // home | award | redeem | history | addkid
  awardCat: CATS[0].id,
  awardAmt: 10,
  awardNote: "",
  awardParent: "Dad",
  newName: "", newAva: "🐶", newColor: "#7C3AED", newPhoto: null,
  pendingPhotoKid: null,
  syncTime: null,
  pollTimer: null,
};

// ─── Firebase ──────────────────────────────────────────────────────────────────
function fbPath(pin){ return `${FB_URL}/families/${pin}.json?auth=${FB_KEY}`; }

async function fbRead(pin){
  try{
    const r = await fetch(fbPath(pin));
    if(!r.ok) return null;
    const raw = await r.json();
    return normalise(raw);
  }catch(e){ console.error("fbRead",e); return null; }
}

async function fbWrite(pin, data){
  try{
    // Convert hist arrays to keyed objects (Firebase hates arrays)
    const hist = {};
    (data.kids||[]).forEach(k=>{
      const arr = Array.isArray(data.hist[k.id]) ? data.hist[k.id] : Object.values(data.hist[k.id]||{});
      hist[k.id] = {};
      arr.forEach(e=>{ hist[k.id][String(e.id)] = e; });
    });
    const slim = {
      ...data,
      kids: data.kids.map(k=>({...k,photo:null})),
      hist,
    };
    const r = await fetch(fbPath(pin),{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(slim),
    });
    if(!r.ok){ const t=await r.text(); console.error("fbWrite",r.status,t); }
  }catch(e){ console.error("fbWrite",e); }
}

function normalise(raw){
  if(!raw) return null;
  let kids = Array.isArray(raw.kids) ? raw.kids : Object.values(raw.kids||{});
  const pts={}, hist={};
  kids.forEach(k=>{
    const p=(raw.pts||{})[k.id]||{};
    pts[k.id]=Object.fromEntries(CATS.map(c=>[c.id,Number(p[c.id]||0)]));
    const h=(raw.hist||{})[k.id]||{};
    hist[k.id]=Array.isArray(h)?h:Object.values(h).sort((a,b)=>(b.id||0)-(a.id||0));
  });
  return {kids,pts,hist,ts:raw.ts||Date.now()};
}

function initPts(){ return Object.fromEntries(CATS.map(c=>[c.id,0])); }
function freshData(){
  return {
    kids:[...KIDS0],
    pts:Object.fromEntries(KIDS0.map(k=>[k.id,initPts()])),
    hist:Object.fromEntries(KIDS0.map(k=>[k.id,[]])),
    ts:Date.now(),
  };
}

// Photos: localStorage only (too big for Firebase)
const PHOTO_KEY = (pin)=>`wm-photos-${pin}`;
function savePhotos(pin,kids){
  try{const p={};kids.forEach(k=>{if(k.photo)p[k.id]=k.photo;});localStorage.setItem(PHOTO_KEY(pin),JSON.stringify(p));}catch(e){}
}
function loadPhotos(pin){
  try{return JSON.parse(localStorage.getItem(PHOTO_KEY(pin))||"{}");}catch(e){return{};}
}
function mergePhotos(kids,photos){
  return kids.map(k=>({...k,photo:photos[k.id]||null}));
}

function persist(){
  if(!state.currentPin||!state.data) return;
  savePhotos(state.currentPin, state.data.kids);
  fbWrite(state.currentPin, {...state.data, ts:Date.now()});
}

function startPolling(pin){
  if(state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = setInterval(async()=>{
    if(!state.currentPin) return;
    const remote = await fbRead(state.currentPin);
    if(remote && (remote.ts||0)>(state.data?.ts||0)){
      const photos = loadPhotos(state.currentPin);
      state.data = {...remote, kids:mergePhotos(remote.kids,photos)};
      state.syncTime = new Date();
      renderApp();
    }
  },10000);
}

// ─── Helpers ───────────────────────────────────────────────────────────────────
function total(kidId){
  if(!state.data) return 0;
  return Object.values(state.data.pts[kidId]||{}).reduce((a,b)=>a+b,0);
}

function stamp(){
  return {
    date:new Date().toLocaleDateString(),
    time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),
  };
}

function showToast(msg, type="ok"){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.style.background=type==="err"?"#EF4444":type==="warn"?"#F97316":type==="redeem"?"#8B5CF6":"#10B981";
  t.style.display="block";
  t.style.animation="none"; t.offsetHeight; t.style.animation="pop .25s ease";
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.style.display="none",2500);
}

function resizeImg(file){
  return new Promise(res=>{
    const rd=new FileReader();
    rd.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const s=Math.min(1,260/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=img.width*s|0; c.height=img.height*s|0;
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",0.6));
      };
      img.src=e.target.result;
    };
    rd.readAsDataURL(file);
  });
}

function avaHTML(kid, sz){
  if(!kid) return "";
  if(kid.photo) return `<img src="${kid.photo}" class="ava" style="width:${sz}px;height:${sz}px;border:3px solid ${kid.color}"/>`;
  return `<div class="ava-emoji" style="width:${sz}px;height:${sz}px;background:${kid.color}33;border:3px solid ${kid.color};font-size:${Math.round(sz*.45)}px">${kid.avatar}</div>`;
}

// ─── Render ────────────────────────────────────────────────────────────────────
function render(){
  if(state.screen==="pin") renderPin();
  else renderApp();
}

function renderPin(){
  const app=document.getElementById("app");
  const dots=Array.from({length:Math.max(4,state.pin.length)}).map((_,i)=>
    `<div class="pin-dot${i<state.pin.length?" filled":""}"></div>`
  ).join("");
  const keys=[1,2,3,4,5,6,7,8,9,"",0,"⌫"];
  const numpad=keys.map(k=>{
    if(k==="") return `<button class="empty" disabled></button>`;
    if(k==="⌫") return `<button class="backspace btn" onclick="pinKey('⌫')">⌫</button>`;
    return `<button class="btn" onclick="pinKey(${k})">${k}</button>`;
  }).join("");
  app.innerHTML=`
  <div id="pin-screen">
    <div style="font-size:60px;margin-bottom:8px" class="float">👁️</div>
    <div style="font-size:26px;font-weight:900;letter-spacing:1px;margin-bottom:4px">WatchMe</div>
    <div style="font-size:13px;opacity:.45;margin-bottom:36px">Family Points Tracker</div>
    <div style="width:100%;max-width:290px">
      <div style="text-align:center;font-size:11px;font-weight:800;opacity:.5;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px">🔒 Family PIN</div>
      <div class="pin-dots">${dots}</div>
      <div class="numpad">${numpad}</div>
      <div id="pin-err" style="text-align:center;color:#FC9494;font-size:13px;font-weight:700;margin-bottom:10px;min-height:20px"></div>
      <button class="btn" id="unlock-btn" onclick="unlock()" style="width:100%;border-radius:14px;padding:15px;background:linear-gradient(135deg,#7C3AED,#3B82F6);color:#fff;font-weight:900;font-size:16px;border:none;opacity:${state.pin.length>=4?1:.4};box-shadow:0 4px 20px rgba(124,58,237,.4)">Unlock →</button>
      <div style="text-align:center;font-size:11px;opacity:.3;margin-top:14px;line-height:1.7">First time? Any PIN creates your family.<br/>Share the same PIN with your wife.</div>
    </div>
  </div>`;
}

function renderApp(){
  if(!state.data) return;
  const app=document.getElementById("app");
  const {data,activeKid,view}=state;
  const ak=data.kids.find(k=>k.id===activeKid)||data.kids[0];
  const kPts=data.pts[ak?.id]||{};
  const kHist=data.hist[ak?.id]||[];
  const kTot=total(ak?.id);

  const kidTabs=data.kids.map(k=>{
    const active=k.id===activeKid;
    return `<div class="kid-tab card" onclick="switchKid('${k.id}')" style="background:${active?`linear-gradient(135deg,${k.color}cc,${k.color}77)`:"rgba(255,255,255,0.07)"};border-color:${active?k.color:"transparent"};box-shadow:${active?`0 4px 18px ${k.color}44`:"none"}">
      ${avaHTML(k,34)}
      <div><div style="font-weight:800;font-size:13px">${k.name}</div><div style="font-size:11px;opacity:.8;font-weight:700">${total(k.id)} pts</div></div>
    </div>`;
  }).join("");

  let content="";

  if(view==="home"&&ak){
    const catCards=CATS.map(c=>{
      const v=kPts[c.id]??0;
      const pos=Object.values(kPts).filter(x=>x>0).reduce((a,b)=>a+b,0);
      const pct=pos>0?Math.max(0,v)/pos:0;
      return `<div class="cat-card" style="position:relative">
        <button class="btn" onclick="resetCat('${c.id}')" title="Reset ${c.label}" style="position:absolute;top:8px;right:8px;background:none;border:none;font-size:13px;opacity:.35;cursor:pointer;padding:2px">↺</button>
        <div style="font-size:20px;margin-bottom:3px">${c.emoji}</div>
        <div style="font-size:11px;opacity:.55;font-weight:700">${c.label}</div>
        <div style="font-size:22px;font-weight:900;color:${v<0?"#EF4444":ak.color}">${v}</div>
        <div style="height:3px;background:rgba(255,255,255,0.1);border-radius:3px;margin-top:5px">
          <div style="height:100%;width:${pct*100}%;background:${ak.color};border-radius:3px;transition:width .5s"></div>
        </div>
      </div>`;
    }).join("");

    content=`
    <div class="fadein">
      <div class="hero" style="background:linear-gradient(135deg,${ak.color}28,${ak.color}0d);border:1.5px solid ${ak.color}40">
        <div class="hero-photo-wrap float">
          ${avaHTML(ak,88)}
          <button class="hero-edit-btn btn" onclick="editPhoto()" style="border:2px solid ${ak.color}">📷</button>
        </div>
        <div style="font-size:14px;opacity:.65;font-weight:700;margin-bottom:2px">${ak.name}'s Total</div>
        <div style="font-size:64px;font-weight:900;line-height:1;background:linear-gradient(135deg,${ak.color},#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${kTot}</div>
        <div style="font-size:11px;opacity:.4;font-weight:700;letter-spacing:2px">POINTS</div>
      </div>
      <div style="margin-bottom:18px">
        <div class="section-label">By Category</div>
        <div class="cat-grid">${catCards}</div>
      </div>
      <div style="text-align:right;margin-top:-10px;margin-bottom:14px">
        <button class="btn" onclick="resetAllPoints()" style="background:none;border:none;color:rgba(255,255,255,0.35);font-size:11px;font-weight:700;cursor:pointer;padding:4px 0">↺ Reset all points</button>
      </div>
      <div class="action-grid-2">
        <button class="btn" onclick="setView('award');setAwardSign(1)" style="background:linear-gradient(135deg,${ak.color},${ak.color}99);border-radius:14px;padding:15px;color:#fff;font-weight:800;font-size:14px;box-shadow:0 4px 14px ${ak.color}44">⭐ Award</button>
        <button class="btn" onclick="setView('award');setAwardSign(-1)" style="background:linear-gradient(135deg,#EF444460,#EF444428);border:1.5px solid #EF444448;border-radius:14px;padding:15px;color:#fff;font-weight:800;font-size:14px">⚡ Penalty</button>
      </div>
      <div class="action-grid-2b">
        <button class="btn" onclick="setView('redeem')" style="background:linear-gradient(135deg,#8B5CF660,#8B5CF628);border:1.5px solid #8B5CF648;border-radius:14px;padding:15px;color:#fff;font-weight:800;font-size:14px">🎁 Redeem</button>
        <button class="btn" onclick="setView('history')" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:15px;color:#fff;font-weight:800;font-size:14px">📋 History</button>
      </div>
      <div style="border-top:1px solid rgba(255,255,255,0.07);padding-top:14px">
        <button class="btn" onclick="confirmRemove('${ak.id}')" style="width:100%;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:13px;padding:11px 0;color:#FC9494;font-weight:800;font-size:13px">🗑️ Remove ${ak.name}</button>
      </div>
    </div>`;
  }

  else if(view==="award"&&ak){
    const isNeg=state.awardAmt<0;
    const pills=[5,10,15,20,25,50].map(n=>{
      const v=isNeg?-n:n;
      const active=Math.abs(state.awardAmt)===n;

// ─── Actions ───────────────────────────────────────────────────────────────────
function pinKey(k){
  if(k==="⌫"){ state.pin=state.pin.slice(0,-1); }
  else if(state.pin.length<6){ state.pin=state.pin+k; }
  document.getElementById("pin-err").textContent="";
  // Update dots and button
  const dots=document.querySelectorAll(".pin-dot");
  dots.forEach((d,i)=>d.classList.toggle("filled",i<state.pin.length));
  const btn=document.getElementById("unlock-btn");
  if(btn) btn.style.opacity=state.pin.length>=4?1:.4;
}

async function unlock(){
  if(state.pin.length<4){ document.getElementById("pin-err").textContent="PIN must be at least 4 digits"; return; }
  const btn=document.getElementById("unlock-btn");
  if(btn){ btn.textContent="Loading…"; btn.disabled=true; }
  const pin=state.pin;
  const photos=loadPhotos(pin);
  let raw=await fbRead(pin);
  let d=raw?{...raw,kids:mergePhotos(raw.kids,photos)}:{...freshData(),kids:mergePhotos(freshData().kids,photos)};
  if(!raw) await fbWrite(pin,d);
  state.currentPin=pin; state.data=d; state.pin="";
  state.syncTime=new Date(); state.screen="app";
  renderApp();
  startPolling(pin);
}

function lock(){
  if(state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer=null; }
  state.currentPin=null; state.data=null; state.screen="pin"; state.pin="";
  renderPin();
}

function switchKid(id){ state.activeKid=id; state.view="home"; renderApp(); }
function setView(v){ state.view=v; renderApp(); }
function setACat(id){
  state.awardCat=id;
  // Just update category button highlights without full re-render
  document.querySelectorAll('.cat-pick').forEach(el=>{
    const isActive=el.dataset.cat===id;
    const ak=state.data?.kids?.find(k=>k.id===state.activeKid)||state.data?.kids?.[0];
    el.style.background=isActive?`${ak?.color||'#7C3AED'}28`:'rgba(255,255,255,0.06)';
    el.style.border=isActive?`1.5px solid ${ak?.color||'#7C3AED'}`:'1px solid rgba(255,255,255,0.1)';
  });
}
function setAmt(v){
  state.awardAmt=v;
  const inp=document.getElementById("amt-input");
  if(inp) inp.value=v;
  // Update pill highlights
  const ak=state.data?.kids?.find(k=>k.id===state.activeKid)||state.data?.kids?.[0];
  document.querySelectorAll('.amount-pill').forEach(el=>{
    el.style.background=Math.abs(v)===Math.abs(parseInt(el.dataset.amt)||0)?(ak?.color||'#7C3AED'):'rgba(255,255,255,0.08)';
  });
  // Update award button text
  const btn=document.getElementById("award-submit-btn");
  if(btn) btn.textContent=v<0?`⚡ Apply ${v} pts`:`⭐ Award +${v} pts`;
}
function setAwardSign(s){
  state.awardAmt=s*Math.abs(state.awardAmt||10);
  renderApp(); // Need full re-render for sign change (button styles change)
}

function doAward(){
  // Read directly from input in case oninput hasn't fired
  const inp=document.getElementById("amt-input");
  if(inp) state.awardAmt=parseInt(inp.value)||state.awardAmt;
  const v=parseInt(state.awardAmt)||0; if(!v) return;
  const cat=CATS.find(c=>c.id===state.awardCat);
  const kid=state.activeKid;
  const note=state.awardNote;
  state.data={
    ...state.data,
    pts:{...state.data.pts,[kid]:{...state.data.pts[kid],[state.awardCat]:(state.data.pts[kid]?.[state.awardCat]||0)+v}},
    hist:{...state.data.hist,[kid]:[
      {id:Date.now(),type:v>=0?"award":"penalty",cat:state.awardCat,amt:v,note:note,by:state.awardParent,...stamp()},
      ...(state.data.hist[kid]||[]),
    ]},
    ts:Date.now(),
  };
  state.awardNote="";
  state.view="home";
  renderApp();
  showToast(`${v>0?"+":""}${v} pts for ${cat?.label}!`, v>=0?"ok":"warn");
  persist();
}

function doRedeem(rid){
  const r=REWARDS.find(x=>x.id===rid); if(!r) return;
  const kid=state.activeKid;
  if(total(kid)<r.cost){ showToast("Not enough points! 😢","err"); return; }
  const pts={...state.data.pts[kid]}; let rem=r.cost;
  for(const k of Object.keys(pts).filter(k=>pts[k]>0)){
    if(rem<=0)break; const d=Math.min(pts[k],rem); pts[k]-=d; rem-=d;
  }
  state.data={...state.data,
    pts:{...state.data.pts,[kid]:pts},
    hist:{...state.data.hist,[kid]:[
      {id:Date.now(),type:"redeem",cat:"redeem",amt:-r.cost,note:r.label,by:state.awardParent,...stamp()},
      ...(state.data.hist[kid]||[]),
    ]},
    ts:Date.now(),
  };
  persist();
  showToast(`🎉 Redeemed ${r.label}!`,"redeem");
  renderApp();
}

function doAddKid(){
  const name=(document.getElementById("new-kid-name")?.value||state.newName||"").trim();
  if(!name) return;
  const id=String(Date.now());
  const k={id,name,avatar:state.newAva,color:state.newColor,photo:state.newPhoto};
  state.data={...state.data,
    kids:[...state.data.kids,k],
    pts:{...state.data.pts,[id]:initPts()},
    hist:{...state.data.hist,[id]:[]},
    ts:Date.now(),
  };
  persist();
  state.newName=""; state.newPhoto=null; state.activeKid=id; state.view="home";
  showToast(`${k.name} added! 🎉`);
  renderApp();
}

  const kid=state.data.kids.find(k=>k.id===kidId);

  modal.className="modal-bg";
  modal.innerHTML=`<div class="modal" style="border:1.5px solid #EF444466">
    <div style="font-size:42px;margin-bottom:10px">${kid?.avatar||"👤"}</div>
    <div style="font-size:17px;font-weight:900;margin-bottom:6px">Remove ${kid?.name}?</div>

    <div style="display:flex;gap:10px">
      <button class="btn" onclick="this.closest('.modal-bg').remove()" style="flex:1;border-radius:12px;padding:13px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;font-weight:800;font-size:14px">Cancel</button>
      <button class="btn" onclick="doRemove('${kidId}');this.closest('.modal-bg').remove()" style="flex:1;border-radius:12px;padding:13px;background:#EF4444;border:none;color:#fff;font-weight:800;font-size:14px">Remove</button>
    </div>
  </div>`;
  document.body.appendChild(modal);

function doRemove(kidId){
  const pts={...state.data.pts}; delete pts[kidId];
  const hist={...state.data.hist}; delete hist[kidId];
  state.data={...state.data,kids:state.data.kids.filter(k=>k.id!==kidId),pts,hist,ts:Date.now()};
  persist();
  state.activeKid=state.data.kids[0]?.id||null;
  state.view="home"; renderApp();
  showToast("Removed","warn");
}

async function doChangePin(btn){
  const p1=document.getElementById("np1").value;
  const p2=document.getElementById("np2").value;
  const err=document.getElementById("pin-chg-err");
  if(p1.length<4){err.textContent="At least 4 digits";return;}
  if(p1!==p2){err.textContent="PINs don't match";return;}
  btn.textContent="Saving…"; btn.disabled=true;
  if(state.data) await fbWrite(p1,state.data);
  state.currentPin=p1;
  btn.closest(".modal-bg").remove();
  showToast("PIN updated! 🔒");
}

function resetCat(catId){
  const ak=state.data.kids.find(k=>k.id===state.activeKid)||state.data.kids[0];
  const cat=CATS.find(c=>c.id===catId);
  const modal=document.createElement("div");
  modal.className="modal-bg";
  modal.innerHTML=`<div class="modal" style="border:1.5px solid #F9731666">
    <div style="font-size:36px;margin-bottom:10px">${cat?.emoji||"⭐"}</div>
    <div style="font-size:17px;font-weight:900;margin-bottom:6px">Reset ${cat?.label}?</div>
    <div style="font-size:12px;opacity:.5;margin-bottom:22px">This will set ${ak?.name}'s ${cat?.label} points to 0.</div>
    <div style="display:flex;gap:10px">
      <button class="btn" onclick="this.closest('.modal-bg').remove()" style="flex:1;border-radius:12px;padding:13px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;font-weight:800;font-size:14px">Cancel</button>
      <button class="btn" onclick="doResetCat('${catId}')" style="flex:1;border-radius:12px;padding:13px;background:#F97316;border:none;color:#fff;font-weight:800;font-size:14px">Reset</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

function doResetCat(catId){
  const kid=state.activeKid;
  state.data={...state.data,
    pts:{...state.data.pts,[kid]:{...state.data.pts[kid],[catId]:0}},
    ts:Date.now()};
  document.querySelectorAll('.modal-bg').forEach(m=>m.remove());
  persist(); renderApp();
  showToast("Category reset","warn");
}

function resetAllPoints(){
  const ak=state.data.kids.find(k=>k.id===state.activeKid)||state.data.kids[0];
  const modal=document.createElement("div");
  modal.className="modal-bg";
  modal.innerHTML=`<div class="modal" style="border:1.5px solid #EF444466">
    <div style="font-size:36px;margin-bottom:10px">🔄</div>
    <div style="font-size:17px;font-weight:900;margin-bottom:6px">Reset all points?</div>
    <div style="font-size:12px;opacity:.5;margin-bottom:22px">This will set all of ${ak?.name}'s points to 0. History is kept.</div>
    <div style="display:flex;gap:10px">
      <button class="btn" onclick="this.closest('.modal-bg').remove()" style="flex:1;border-radius:12px;padding:13px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;font-weight:800;font-size:14px">Cancel</button>
      <button class="btn" onclick="doResetAll()" style="flex:1;border-radius:12px;padding:13px;background:#EF4444;border:none;color:#fff;font-weight:800;font-size:14px">Reset All</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

function doResetAll(){
  const kid=state.activeKid;
  state.data={...state.data,
    pts:{...state.data.pts,[kid]:Object.fromEntries(CATS.map(c=>[c.id,0]))},
    ts:Date.now()};
  document.querySelectorAll('.modal-bg').forEach(m=>m.remove());
  persist(); renderApp();
  showToast("All points reset","warn");
}

function editEntry(entryId){
  const kid=state.activeKid;
  const hist=state.data.hist[kid]||[];
  const entry=hist.find(h=>String(h.id)===String(entryId));
  if(!entry) return;
  const modal=document.createElement("div");
  modal.className="modal-bg";
  modal.innerHTML=`<div class="modal" style="border:1.5px solid #7C3AED66;text-align:left">
    <div style="font-size:17px;font-weight:900;margin-bottom:18px;text-align:center">✏️ Edit Entry</div>
    <div style="margin-bottom:14px">
      <div class="field-label">Points</div>
      <input type="number" id="edit-amt" class="text-input" value="${entry.amt}" style="font-size:18px;font-weight:800;text-align:center"/>
    </div>
    <div style="margin-bottom:18px">
      <div class="field-label">Note</div>
      <input type="text" id="edit-note" class="text-input" value="${entry.note||""}" placeholder="Optional note" style="font-size:13px"/>
    </div>
    <div id="edit-err" style="color:#FC9494;font-size:12px;font-weight:700;margin-bottom:10px;min-height:16px;text-align:center"></div>
    <div style="display:flex;gap:10px">
      <button class="btn" onclick="this.closest('.modal-bg').remove()" style="flex:1;border-radius:11px;padding:12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;font-weight:800;font-size:13px">Cancel</button>
      <button class="btn" onclick="doEditEntry('${entryId}')" style="flex:1;border-radius:11px;padding:12px;background:linear-gradient(135deg,#7C3AED,#3B82F6);border:none;color:#fff;font-weight:800;font-size:13px">Save</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

function doEditEntry(entryId){
  const newAmt=parseInt(document.getElementById("edit-amt").value);
  const newNote=document.getElementById("edit-note").value;
  if(isNaN(newAmt)){document.getElementById("edit-err").textContent="Enter a valid number";return;}
  const kid=state.activeKid;
  const hist=state.data.hist[kid]||[];
  const entry=hist.find(h=>String(h.id)===String(entryId));
  if(!entry) return;
  const oldAmt=entry.amt;
  const diff=newAmt-oldAmt;
  // Update the history entry
  const newHist=hist.map(h=>String(h.id)===String(entryId)?{...h,amt:newAmt,note:newNote}:h);
  // Adjust category points by the difference
  const cat=entry.cat;
  const newPts={...state.data.pts[kid]};
  if(cat&&cat!=="redeem") newPts[cat]=(newPts[cat]||0)+diff;
  state.data={...state.data,
    pts:{...state.data.pts,[kid]:newPts},
    hist:{...state.data.hist,[kid]:newHist},
    ts:Date.now()};
  document.querySelector(".modal-bg")?.remove();
  persist(); renderApp();
  showToast("Entry updated ✓");
}

function deleteEntry(entryId){
  const kid=state.activeKid;
  const hist=state.data.hist[kid]||[];
  const entry=hist.find(h=>String(h.id)===String(entryId));
  if(!entry) return;
  const modal=document.createElement("div");
  modal.className="modal-bg";
  modal.innerHTML=`<div class="modal" style="border:1.5px solid #EF444466">
    <div style="font-size:36px;margin-bottom:10px">🗑️</div>
    <div style="font-size:17px;font-weight:900;margin-bottom:6px">Delete this entry?</div>
    <div style="font-size:12px;opacity:.5;margin-bottom:4px">${entry.amt>0?"+":""}${entry.amt} pts · ${entry.date}</div>
    <div style="font-size:12px;opacity:.5;margin-bottom:22px">Points will be reversed.</div>
    <div style="display:flex;gap:10px">
      <button class="btn" onclick="this.closest('.modal-bg').remove()" style="flex:1;border-radius:12px;padding:13px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;font-weight:800;font-size:14px">Cancel</button>
      <button class="btn" onclick="doDeleteEntry('${entryId}')" style="flex:1;border-radius:12px;padding:13px;background:#EF4444;border:none;color:#fff;font-weight:800;font-size:14px">Delete</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

function doDeleteEntry(entryId){
  const kid=state.activeKid;
  const hist=state.data.hist[kid]||[];
  const entry=hist.find(h=>String(h.id)===String(entryId));
  if(!entry) return;
  const newPts={...state.data.pts[kid]};
  const cat=entry.cat;
  if(cat&&cat!=="redeem") newPts[cat]=(newPts[cat]||0)-entry.amt;
  state.data={...state.data,
    pts:{...state.data.pts,[kid]:newPts},
    hist:{...state.data.hist,[kid]:hist.filter(h=>String(h.id)!==String(entryId))},
    ts:Date.now()};
  document.querySelectorAll('.modal-bg').forEach(m=>m.remove());
  persist(); renderApp();
  showToast("Entry deleted","warn");
}

// File input handlers
document.getElementById("img-input").addEventListener("change",async e=>{
  const f=e.target.files[0]; if(!f) return;
  state.newPhoto=await resizeImg(f); e.target.value=""; renderApp();
});
document.getElementById("edit-img-input").addEventListener("change",async e=>{
  const f=e.target.files[0]; if(!f) return;
  const url=await resizeImg(f); e.target.value="";
  if(!state.pendingPhotoKid||!state.data) return;
  state.data={...state.data,kids:state.data.kids.map(k=>k.id===state.pendingPhotoKid?{...k,photo:url}:k),ts:Date.now()};
  savePhotos(state.currentPin,state.data.kids);
  // Don't write photo to Firebase (too large) — local only
  renderApp(); showToast("Photo updated! 📸");
});

// ─── Boot ──────────────────────────────────────────────────────────────────────
render();
</script>
</body>
